# Run from this folder:  docker compose up -d --build   then open http://localhost:8080
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    command: postgres -c max_connections=300
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    user: root                      # needed to use the Docker socket on Docker Desktop
    ports:
      - "8080:8080"
    environment:
      TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  jenkins_home:
